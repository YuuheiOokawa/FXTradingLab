name: fx-trading-lab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fxlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fxlab}
      POSTGRES_DB: ${POSTGRES_DB:-fxlab}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fxlab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fxlab}:${POSTGRES_PASSWORD:-fxlab}@postgres:5432/${POSTGRES_DB:-fxlab}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fxlab}:${POSTGRES_PASSWORD:-fxlab}@postgres:5432/${POSTGRES_DB:-fxlab}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fxlab}:${POSTGRES_PASSWORD:-fxlab}@postgres:5432/${POSTGRES_DB:-fxlab}
      REDIS_URL: redis://redis:6379/0
    command: python -m app.worker.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* vars must be build ARGs, not runtime `environment:` —
      # see the comment in frontend/Dockerfile for why (a real bug found
      # during the BFF migration: the old `environment:`-only config here
      # never actually reached the browser bundle).
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Server-only — read at request time by Next.js Route Handlers
      # (app/api/backend/[...path]/route.ts, app/api/ws-ticket/route.ts,
      # app/api/session-login/route.ts), never inlined into the browser
      # bundle, so `environment:` (runtime) is correct here, unlike the
      # NEXT_PUBLIC_* var above.
      BACKEND_INTERNAL_URL: http://api:8000
      BACKEND_API_TOKEN: ${APP_API_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
