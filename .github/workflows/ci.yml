name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fxlab
          POSTGRES_PASSWORD: fxlab
          POSTGRES_DB: fxlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fxlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://fxlab:fxlab@localhost:5432/fxlab_test
      REDIS_URL: redis://localhost:6379/1
      APP_ENV: development
      BROKER_PROVIDER: mock
      LIVE_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . || true # advisory in v1 — see docs/11_SECURITY.md
      - name: Dependency vulnerability scan (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt || true # advisory in v1 — see docs/11_SECURITY.md
      - name: Run migrations
        run: alembic upgrade head
      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - name: Lint (eslint)
        run: npm run lint
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high || true # advisory in v1 — see docs/11_SECURITY.md
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  e2e:
    runs-on: ubuntu-latest
    # Advisory, not a required gate: this boots the whole stack (Postgres,
    # Redis, API, worker, Next.js dev server) in CI and drives it with a real
    # browser (docs/18_E2E_TESTING.md). Genuinely useful for catching
    # integration-only breaks, but timing-sensitive (mock tick generation,
    # WebSocket delivery) in a way the backend/frontend unit suites aren't —
    # a flaky run here should not block a PR the way a lint/type/unit
    # failure does. `continue-on-error` mirrors the existing advisory
    # pattern used for ruff/pip-audit/npm-audit above.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fxlab
          POSTGRES_PASSWORD: fxlab
          POSTGRES_DB: fxlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fxlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fxlab:fxlab@localhost:5432/fxlab
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development
      BROKER_PROVIDER: mock
      LIVE_TRADING_ENABLED: "false"
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - name: Start API
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        working-directory: backend
      - name: Start worker
        run: nohup python -m app.worker.main &
        working-directory: backend
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "API never became healthy" && exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start frontend
        run: nohup npm run dev &
        working-directory: frontend
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/dashboard && exit 0
            sleep 1
          done
          echo "Frontend never became ready" && exit 1
      - name: Run E2E suite
        run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose config -q
