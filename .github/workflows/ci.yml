name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fxlab
          POSTGRES_PASSWORD: fxlab
          POSTGRES_DB: fxlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fxlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://fxlab:fxlab@localhost:5432/fxlab_test
      REDIS_URL: redis://localhost:6379/1
      APP_ENV: development
      BROKER_PROVIDER: mock
      LIVE_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . || true # advisory in v1 — see docs/11_SECURITY.md
      - name: Dependency vulnerability scan (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt || true # advisory in v1 — see docs/11_SECURITY.md
      - name: Run migrations
        run: alembic upgrade head
      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - name: Lint (eslint)
        run: npm run lint
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high || true # advisory in v1 — see docs/11_SECURITY.md
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose config -q
